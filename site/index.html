<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A small site for learning DevOps by doing.">
    <title>My DevOps Learning Project</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">LEARN BY BUILDING</p>
      <h1>My DevOps Learning Project</h1>
      <p class="intro">
        A tiny website to practice Git, automated testing, cloud infrastructure,
        and safe deployments.
      </p>
      <section aria-labelledby="status-heading">
        <h2 id="status-heading">Deployment status</h2>
        <p id="status" role="status">Checking the app...</p>
        <button id="check-button" type="button">Check again</button>
      </section>
      <p class="next-step">Next step: make a small change, test it, and deploy it.</p>
    </main>
  </body>
</html>
